workflows:
  android-release:
    name: eSource Android
    max_build_duration: 60
    # Free personal plan: macOS M2 only. linux_x2 needs billing enabled.
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 20
      vars:
        PACKAGE_NAME: com.esource.lab
        API_PATH_BASE: https://sspldev-esource.sspluniverse.com/API
      # Add this group in Codemagic after you upload a keystore.
      # groups:
      #   - keystore_credentials
    scripts:
      - name: Set mobile API config
        script: |
          printf '%s\n' "{\"apiPathBase\":\"${API_PATH_BASE}\",\"isNative\":true}" > public/app.config.json
      - name: Install npm packages
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Android APK (debug — no Play keystore required)
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          java -version
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-release:
    name: eSource iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.esource.lab
        API_PATH_BASE: https://sspldev-esource.sspluniverse.com/API
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: App
    scripts:
      - name: Set mobile API config
        script: |
          printf '%s\n' "{\"apiPathBase\":\"${API_PATH_BASE}\",\"isNative\":true}" > public/app.config.json
      - name: Install npm packages
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build iOS Simulator App
        script: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Simulator Build
        script: |
          cd ios/App/build/Build/Products/*-iphonesimulator
          zip -r ../../../../../App-Simulator.zip App.app
    artifacts:
      - App-Simulator.zip
